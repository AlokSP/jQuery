<!DOCTYPE html>
<html>
<head>
    <title>Animate Example</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        div {
            width: 250px;
            padding: 10px;
            margin-bottom: 15px;
            color: black;
            background-color: aquamarine;
            position: relative; 
        }

        button {
            padding: 5px 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Animate: It is used for animate the element.</h1>

<button id="btn">Animate</button>

<div id="div1">
    <h2>Welcome to jQuery Animate Content.</h2>
</div>

<script>
$(document).ready(function () {
    $("#btn").click(function () {
        $("#div1").animate({left: '300px'}, 1000).animate({top: '300px'}, 2000);
    });
});
</script>

</body>
</html>
